# Copy this into your GitHub repo via:
# GitHub.com -> Actions tab -> "set up a workflow yourself"
# (GitHub blocks third-party sync tools from pushing .github/workflows/ directly.)

name: Build SKY LAUNCHER Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and sync Android web assets
        run: |
          npm install --legacy-peer-deps
          npm run android:sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload SKY LAUNCHER APK
        uses: actions/upload-artifact@v4
        with:
          name: sky-launcher-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
